<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>待办</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff; --fg: #0a0a0a; --muted: #737373; --line: #e5e5e5; --soft: #f5f5f5; --card: #fff;
      --accent: #16a34a; --high: #dc2626; --chip: #f4f4f5; --shade: rgb(0 0 0 / .35); --run: #2563eb; --wait: #d97706;
      --run-soft: #eff6ff; --wait-soft: #fffbeb; --high-soft: #fef2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --line: #262626; --soft: #171717; --card: #141414; --accent: #22c55e; --high: #f87171; --chip: #1c1c1e; --shade: rgb(0 0 0 / .6); --run: #60a5fa; --wait: #fbbf24;
        --run-soft: #172033; --wait-soft: #2a2110; --high-soft: #2a1414; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "PingFang SC", sans-serif; }
    body { padding-bottom: calc(env(safe-area-inset-bottom) + 24px); }
    body.locked { overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    input, textarea, select { font: inherit; color: inherit; }
    svg { display: block; }
    [hidden] { display: none !important; }

    header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
    .top { display: flex; gap: 6px; align-items: center; }
    .seg { flex: 1; display: flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; }
    .seg button { flex: 1; height: 32px; border-radius: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
    .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
    .icon-btn { position: relative; flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
    .icon-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
    .icon-btn svg { width: 20px; height: 20px; }
    .badge { position: absolute; top: 1px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--muted); color: var(--bg); font-size: 10px; line-height: 16px; font-weight: 600; text-align: center; }
    .chips { display: flex; gap: 6px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--chip); font-size: 13px; color: var(--muted); white-space: nowrap; }
    .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
    .chip small { opacity: .7; margin-left: 3px; }
    .chip.warn:not([aria-pressed="true"]) { color: var(--high); }

    .add { display: flex; gap: 8px; padding: 12px 16px 4px; align-items: flex-end; }
    .add .box { flex: 1; min-width: 0; }
    .add input, .add textarea { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); outline: none; display: block; }
    .add textarea { resize: none; height: 84px; }
    .add input:focus, .add textarea:focus { border-color: var(--accent); }
    .add.ai textarea { border-color: var(--run); }
    .add > button { flex: none; height: 42px; padding: 0 14px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
    .add > button:disabled { opacity: .4; }
    .add.ai > button.go { background: var(--run); }
    .add .spark { width: 42px; padding: 0; background: var(--soft); color: var(--run); display: grid; place-items: center; }
    .add .spark[aria-pressed="true"] { background: var(--run); color: #fff; }
    .add .spark svg { width: 20px; height: 20px; }
    .trash-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 4px; font-size: 13px; color: var(--muted); }
    .trash-bar button { color: var(--high); font-size: 14px; padding: 6px 10px; border-radius: 8px; }
    .trash-bar button.armed { background: var(--high); color: #fff; }

    .group { padding: 14px 16px 2px; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
    .group b { font-weight: 600; color: var(--fg); font-size: 13px; }
    .group span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .group i { font-style: normal; margin-left: auto; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border-bottom: 1px solid var(--line); background: var(--bg); }
    li.dragging { position: relative; z-index: 5; box-shadow: 0 8px 24px rgb(0 0 0 / .18); border-radius: 10px; }
    .row { display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; }
    .check { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s, border-color .15s; }
    .check.high { border-color: var(--high); }
    .check.prog { border-color: var(--run); border-style: dashed; }
    .check.wait { border-color: var(--wait); }
    .check svg { width: 14px; height: 14px; opacity: 0; }
    .done .check { background: var(--accent); border-color: var(--accent); border-style: solid; }
    .done .check svg { opacity: 1; }
    .trashed .check { visibility: hidden; }
    .body { flex: 1; min-width: 0; text-align: left; }
    .title { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .done .title, .trashed .title { color: var(--muted); }
    .done .title { text-decoration: line-through; }
    .note { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
    .ask-line { color: var(--wait); font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 12px; color: var(--muted); align-items: center; }
    .pill { padding: 0 6px; border-radius: 6px; line-height: 18px; font-weight: 600; }
    .pill.prog { background: var(--run-soft); color: var(--run); }
    .pill.wait { background: var(--wait-soft); color: var(--wait); }
    .pill.late { background: var(--high-soft); color: var(--high); }
    .meta .p-high { color: var(--high); font-weight: 600; }
    .meta .tag { color: var(--accent); }
    .meta .ran { color: var(--run); }
    .handle { flex: none; width: 28px; height: 28px; margin: -2px -8px 0 0; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; }
    .handle svg { width: 18px; height: 18px; }

    .empty { padding: 64px 32px; text-align: center; color: var(--muted); }
    .empty svg { width: 44px; height: 44px; opacity: .5; margin: 0 auto 8px; }
    .more { display: block; width: 100%; padding: 14px; color: var(--muted); font-size: 13px; }

    /* 底部面板 */
    .shade { position: fixed; inset: 0; z-index: 10; background: var(--shade); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .shade.on { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg);
      border-radius: 16px 16px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 16px); transform: translateY(105%); transition: transform .22s ease; }
    .sheet.on { transform: none; }
    .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
    .s-title { font-size: 17px; font-weight: 600; word-break: break-word; }
    .s-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; }
    .s-note { color: var(--muted); font-size: 14px; white-space: pre-wrap; word-break: break-word; margin-top: 6px; max-height: 30vh; overflow: auto; }
    .s-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .s-links a { display: block; font-size: 13px; color: var(--run); word-break: break-all; margin-top: 2px; }
    .askbox { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--wait-soft); }
    .askbox .q { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .askbox .q b { color: var(--wait); }
    .askbox textarea { width: 100%; margin-top: 8px; min-height: 64px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); outline: none; resize: vertical; }
    .askbox .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; font-size: 12px; color: var(--muted); }
    .askbox .row2 button { height: 36px; padding: 0 16px; border-radius: 10px; background: var(--wait); color: #fff; font-weight: 600; font-size: 14px; }
    .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 10px; }
    .big button { height: 52px; border-radius: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .big .run { background: var(--run); color: #fff; }
    .big .chk { background: var(--soft); }
    .big svg { width: 18px; height: 18px; }
    .target { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--soft); font-size: 13px; }
    .target .t { flex: 1; min-width: 0; }
    .target .t b { font-weight: 600; }
    .target .t small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .target .warn { color: var(--high); }
    .target button { flex: none; color: var(--run); font-size: 14px; padding: 4px 6px; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 2px; font-size: 14px; }
    .switch small { display: block; color: var(--muted); font-size: 12px; }
    .tog { flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background .15s; }
    .tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .15s; }
    .tog[aria-checked="true"] { background: var(--accent); }
    .tog[aria-checked="true"]::after { transform: translateX(18px); }
    .kv { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--muted); }
    .kv > span { flex: none; width: 56px; }
    .kv .seg button { height: 30px; font-size: 13px; }
    .list-btns { border-top: 1px solid var(--line); margin-top: 8px; }
    .list-btns button { display: flex; width: 100%; align-items: center; gap: 12px; padding: 14px 2px; border-bottom: 1px solid var(--line); font-size: 15px; text-align: left; }
    .list-btns button:last-child { border-bottom: 0; }
    .list-btns svg { width: 20px; height: 20px; color: var(--muted); }
    .list-btns .danger, .list-btns .danger svg { color: var(--high); }
    .list-btns .danger.armed { background: var(--high); color: #fff; border-radius: 10px; padding-left: 10px; }
    .list-btns .danger.armed svg { color: #fff; }
    .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); margin-top: 12px; }
    .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); outline: none; font-size: 15px; }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { min-height: 84px; resize: vertical; }
    .field .seg button { height: 30px; font-size: 13px; }
    .field .inline { display: flex; gap: 8px; align-items: center; }
    .field .inline button { flex: none; color: var(--run); font-size: 13px; }
    .prompt { min-height: 180px !important; font-size: 13px !important; line-height: 1.5; }
    .foot { display: flex; gap: 10px; margin-top: 16px; }
    .foot button { flex: 1; height: 46px; border-radius: 12px; font-weight: 600; background: var(--soft); }
    .foot .primary { background: var(--run); color: #fff; }
    .foot .primary:disabled { opacity: .5; }
    .s-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .s-head button { color: var(--run); font-size: 15px; padding: 4px 0; min-width: 40px; text-align: left; }
    .s-head button:last-child { text-align: right; }
    .s-head b { flex: 1; text-align: center; font-size: 16px; }
    .s-head span { min-width: 40px; }
    .pick button, .opt-list button { display: block; width: 100%; text-align: left; padding: 12px 4px; border-bottom: 1px solid var(--line); }
    .pick b { font-weight: 600; }
    .pick small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick .origin { color: var(--accent); }
    .pick .busy { color: var(--wait); }
    .opt-list button { display: flex; justify-content: space-between; }
    .opt-list button[aria-checked="true"] { color: var(--run); font-weight: 600; }
    .sect { font-size: 12px; color: var(--muted); margin: 14px 2px 2px; }
    .hint { color: var(--muted); font-size: 12px; margin: 8px 2px; }
    .timeline { margin-top: 12px; border-top: 1px solid var(--line); }
    .timeline > button { width: 100%; text-align: left; padding: 12px 2px; font-size: 14px; color: var(--muted); }
    .ev { display: flex; gap: 8px; padding: 6px 2px; font-size: 13px; }
    .ev .when { flex: none; width: 72px; color: var(--muted); font-size: 12px; }
    .ev .what { flex: 1; min-width: 0; word-break: break-word; white-space: pre-wrap; }
    .ev .what b { font-weight: 600; }
    .ev.question .what { color: var(--wait); }
    .ev.reply .what { color: var(--accent); }
    .ops label { display: flex; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 14px; align-items: flex-start; }
    .ops input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--run); }
    .ops small { display: block; color: var(--muted); font-size: 12px; }
    .ops .opk { font-weight: 600; color: var(--run); margin-right: 4px; }
    .aireply { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--run-soft); margin: 8px 0; white-space: pre-wrap; }
    .cc-head { display: flex; align-items: baseline; gap: 6px; padding: 14px 16px 4px; font-size: 13px; }
    .cc-head b { font-weight: 600; }
    .cc-head span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
    .cc-head i { font-style: normal; color: var(--muted); font-size: 12px; flex: none; }
    .cc-ico { flex: none; width: 22px; height: 22px; margin-top: 1px; display: grid; place-items: center; font-size: 15px; color: var(--muted); }
    .cc-ico.prog { color: var(--run); }
    .cc-ico.done { color: var(--accent); }
    .cc-row.completed .title { color: var(--muted); text-decoration: line-through; }
    .cc-more { display: block; width: 100%; text-align: left; padding: 8px 16px 10px 50px; font-size: 12px; color: var(--muted); }
    .linked { color: var(--accent); }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); z-index: 20; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; display: flex; gap: 14px; align-items: center; transition: .2s; max-width: calc(100% - 32px); }
    #toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    #toast button { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="seg" id="status" role="group">
        <button data-v="active" aria-pressed="true"></button>
        <button data-v="done" aria-pressed="false"></button>
        <button data-v="all" aria-pressed="false"></button>
        <button data-v="cc" aria-pressed="false"></button>
      </div>
      <button class="icon-btn" id="viewBtn"></button>
      <button class="icon-btn" id="trashBtn" aria-pressed="false"></button>
    </div>
    <div class="chips" id="filters"></div>
    <div class="chips" id="projects"></div>
  </header>
  <form class="add" id="addForm">
    <button type="button" class="spark" id="aiBtn" aria-pressed="false"></button>
    <div class="box"><input id="addInput" maxlength="200" enterkeyhint="done" autocomplete="off" /><textarea id="aiInput" maxlength="2000" hidden></textarea></div>
    <button id="addBtn" type="submit" disabled></button>
  </form>
  <div class="trash-bar" id="trashBar" hidden><span id="trashHint"></span><button id="emptyBtn" type="button"></button></div>
  <main id="list"></main>
  <div class="shade" id="shade"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status"><span></span><button type="button" hidden></button></div>
  <script src="app.js"></script>
</body>
</html>
