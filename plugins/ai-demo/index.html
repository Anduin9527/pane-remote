<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 演示</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #6b7280; --line: #e5e7eb; --card: #f9fafb; --accent: #7c3aed; --err: #dc2626; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --fg: #ececee; --muted: #9ca3af; --line: #2a2a2e; --card: #151518; --err: #f87171; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px 12px 24px; font: 15px/1.55 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
    select, textarea, button { font: inherit; color: var(--fg); }
    select { height: 38px; min-width: 0; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    .row { display: flex; gap: 8px; align-items: center; }
    #model { flex: 1; }
    #effort { flex: none; max-width: 38%; }
    .meta { margin: 6px 2px 10px; font-size: 12px; color: var(--muted); min-height: 18px; }
    textarea { display: block; width: 100%; min-height: 96px; max-height: 40vh; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); resize: vertical; outline: none; }
    textarea:focus { border-color: var(--accent); }
    .bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    button { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; }
    button.primary { margin-left: auto; min-width: 88px; border: 0; background: var(--accent); color: #fff; font-weight: 600; }
    button.stop { background: var(--err); }
    button:disabled { opacity: .4; }
    #thumb { display: none; position: relative; }
    #thumb img { display: block; height: 40px; width: 40px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    #thumb button { position: absolute; top: -8px; right: -8px; height: 20px; width: 20px; padding: 0; border-radius: 10px; font-size: 12px; line-height: 18px; background: var(--fg); color: var(--bg); border: 0; }
    #thumbNote { font-size: 12px; color: var(--muted); }
    #out { margin-top: 14px; }
    #reasoning { display: none; margin-bottom: 8px; padding: 8px 10px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13px; white-space: pre-wrap; max-height: 30vh; overflow: auto; }
    #answer { white-space: pre-wrap; overflow-wrap: anywhere; }
    #answer:empty { display: none; }
    #status { margin-top: 10px; font-size: 12px; color: var(--muted); }
    #status.err { color: var(--err); }
    .caret::after { content: '▍'; animation: blink 1s steps(1) infinite; color: var(--accent); }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="row">
    <select id="model" aria-label="模型"><option>载入模型…</option></select>
    <select id="effort" aria-label="推理等级"></select>
  </div>
  <div class="meta" id="meta"></div>
  <textarea id="prompt" placeholder="输入问题…" enterkeyhint="send"></textarea>
  <div class="bar">
    <button id="pick" type="button">图片</button>
    <input id="file" type="file" accept="image/*" hidden />
    <div id="thumb"><img alt="附图" /><button type="button" id="unpick" aria-label="去掉图片">×</button></div>
    <span id="thumbNote"></span>
    <button id="send" class="primary" type="button">发送</button>
  </div>
  <div id="out">
    <div id="reasoning"></div>
    <div id="answer"></div>
    <div id="status"></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id)
    const VISION = { true: '能看图', bridged: '看图（先转成文字）', false: '不能看图' }
    const TIER = { fast: '快', balanced: '均衡', strong: '强' }
    const PROVIDER = { claude: 'Claude Code', codex: 'Codex', cursor: 'Cursor' }
    let models = []
    let image = null // data URL（已缩小）
    let running = null

    const current = () => models.find((m) => m.id === $('model').value)
    function showMeta() {
      const m = current()
      const eff = $('effort')
      eff.innerHTML = ''
      if (!m) { $('meta').textContent = ''; return }
      const efforts = m.efforts || []
      eff.style.display = efforts.length ? '' : 'none'
      eff.append(new Option(`推理：默认${m.defaultEffort ? `（${m.defaultEffort}）` : ''}`, ''))
      for (const e of efforts) eff.append(new Option(`推理：${e}`, e))
      const saved = utools.dbStorage.getItem('effort:' + m.id)
      if (saved && efforts.includes(saved)) eff.value = saved
      $('meta').textContent = [PROVIDER[m.provider] || m.provider, TIER[m.tier], VISION[String(m.vision)], m.tools === true ? '支持工具' : ''].filter(Boolean).join(' · ')
      $('thumbNote').textContent = image && m.vision === false ? '这个模型不能看图' : ''
    }

    async function loadModels() {
      try {
        models = await utools.allAiModels()
      } catch (e) {
        $('model').innerHTML = '<option>没有可用的模型</option>'
        return fail(e)
      }
      const sel = $('model')
      sel.innerHTML = ''
      for (const p of [...new Set(models.map((m) => m.provider))]) {
        const g = document.createElement('optgroup')
        g.label = PROVIDER[p] || p
        for (const m of models.filter((x) => x.provider === p)) g.append(new Option(m.label, m.id))
        sel.append(g)
      }
      const saved = utools.dbStorage.getItem('model')
      sel.value = models.some((m) => m.id === saved) ? saved : (models.find((m) => m.id === 'claude/haiku') || models[0] || {}).id || ''
      showMeta()
    }
    $('model').onchange = () => { utools.dbStorage.setItem('model', $('model').value); showMeta() }
    $('effort').onchange = () => { const m = current(); if (m) utools.dbStorage.setItem('effort:' + m.id, $('effort').value) }

    // 图片：缩到长边 1280、转 JPEG，免得几 MB 的原图走一路
    $('pick').onclick = () => $('file').click()
    $('file').onchange = async () => {
      const f = $('file').files[0]
      $('file').value = ''
      if (!f) return
      try { image = await shrink(f) } catch (e) { return fail(new Error('读不了这张图片：' + e.message)) }
      $('thumb').querySelector('img').src = image
      $('thumb').style.display = 'block'
      showMeta()
    }
    $('unpick').onclick = () => { image = null; $('thumb').style.display = 'none'; showMeta() }
    function shrink(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file)
        const img = new Image()
        img.onload = () => {
          const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight))
          const c = document.createElement('canvas')
          c.width = Math.max(1, Math.round(img.naturalWidth * k))
          c.height = Math.max(1, Math.round(img.naturalHeight * k))
          const g = c.getContext('2d')
          g.fillStyle = '#fff'
          g.fillRect(0, 0, c.width, c.height)
          g.drawImage(img, 0, 0, c.width, c.height)
          URL.revokeObjectURL(url)
          resolve(c.toDataURL('image/jpeg', 0.85))
        }
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('格式不支持')) }
        img.src = url
      })
    }

    function fail(e) {
      $('status').className = 'err'
      $('status').textContent = (e.code === 'aborted' ? '已停止' : `出错了：${e.message}`) + (e.code && e.code !== 'aborted' ? `（${e.code}）` : '')
    }
    const sec = (ms) => (ms / 1000).toFixed(1) + ' 秒'

    async function send() {
      if (running) { running.abort(); return }
      const text = $('prompt').value.trim()
      const m = current()
      if (!text || !m) return
      const effort = $('effort').value
      const model = effort ? `${m.id}@${effort}` : m.id
      const content = image ? [{ type: 'text', text }, { type: 'image_url', image_url: { url: image } }] : text
      $('answer').textContent = ''
      $('reasoning').textContent = ''
      $('reasoning').style.display = 'none'
      $('answer').classList.add('caret')
      $('status').className = ''
      $('status').textContent = `${model} 思考中…`
      $('send').textContent = '停止'
      $('send').classList.add('stop')
      const t0 = performance.now()
      let first = 0
      running = utools.ai({ model, messages: [{ role: 'user', content }] }, (chunk) => {
        if (chunk.reasoning_content) { $('reasoning').style.display = 'block'; $('reasoning').textContent += chunk.reasoning_content }
        if (chunk.content) {
          if (!first) first = performance.now() - t0
          $('answer').textContent += chunk.content
          $('status').textContent = `${model} · 首字 ${sec(first)}`
        }
      })
      try {
        await running
        $('status').textContent = `${model} · 首字 ${first ? sec(first) : '—'} · 共 ${sec(performance.now() - t0)}`
      } catch (e) { fail(e) } finally {
        running = null
        $('answer').classList.remove('caret')
        $('send').textContent = '发送'
        $('send').classList.remove('stop')
      }
    }
    $('send').onclick = send
    $('prompt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send() } })

    utools.onPluginEnter(({ type, payload }) => { if (type === 'over' && typeof payload === 'string') $('prompt').value = payload })
    loadModels()
  </script>
</body>
</html>
